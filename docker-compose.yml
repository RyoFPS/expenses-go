name: finance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sengaja TANPA `ports:` — PostgreSQL hanya di jaringan internal Docker.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_KEY: ${API_KEY}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_INGEST_AUD: ${CF_ACCESS_INGEST_AUD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    # Hanya di-bind ke localhost untuk akses lokal; akses publik nanti lewat cloudflared (M6).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      # Dipakai server Next.js untuk render awal Beranda (meneruskan header Cloudflare Access ke API).
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    # Hanya localhost; akses publik nanti lewat cloudflared (M6).
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backup harian pg_dump -> volume terpisah `backups`, retensi 14 hari (lihat docs/RESTORE.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ops/entrypoint.sh"]
    environment:
      TZ: Asia/Jakarta
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./ops/backup:/ops:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Cloudflare Tunnel (remotely-managed, token dari dashboard Zero Trust). Satu-satunya jalan masuk dari internet.
  # Aktifkan dengan profile: docker compose --profile tunnel up -d   (lihat docs/DEPLOY.md)
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
  backups:
